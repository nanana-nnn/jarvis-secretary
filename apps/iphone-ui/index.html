<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icon.svg" />
    <title>JARVIS Secretary</title>
  </head>
  <body>
    <div id="boot-status" style="box-sizing:border-box;min-height:100vh;padding:2rem;background:#0d0b0a;color:#efe7da;font:16px system-ui">JARVISを読み込んでいます…</div>
    <div id="root"></div>
    <script>
      function showBootError(message) {
        var status = document.getElementById("boot-status");
        if (!status) return;
        status.textContent = "起動エラー: " + message;
        status.style.color = "#d8354c";
      }
      window.addEventListener("error", function (event) {
        showBootError(event.message || "JavaScriptを読み込めませんでした");
      });
      window.addEventListener("unhandledrejection", function (event) {
        showBootError(String(event.reason || "初期化に失敗しました"));
      });
      window.setTimeout(function () {
        var root = document.getElementById("root");
        if (root && !root.childElementCount) showBootError("画面モジュールが起動しませんでした");
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
