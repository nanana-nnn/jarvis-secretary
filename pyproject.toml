[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-secretary"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<9"]

[tool.setuptools]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
